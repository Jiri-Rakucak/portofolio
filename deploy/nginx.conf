# Server block template: adjust root to the same directory as DEPLOY_DIR.
server {
    listen 80;
    server_name _;
    root /var/www/portfolio;
    index index.html;

    # Temporary IP-only deployment; remove this when publishing on a stable domain.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fingerprinted Vite output can be cached; missing chunks must not return HTML.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ /\. {
        deny all;
    }

    # Project screenshots keep stable names, so do not give them immutable caching.
    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
    }

    location = /index.html {
        expires -1;
    }

    # BrowserRouter deep links use the SPA entry point, revalidated on each visit.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
